[workspace]
resolver = "2"
members = [
    "shared/hub",
    "shared/mcp",
    "shared/shell",
    "shared/ui",
    "crates/core",
    "crates/media",
    "crates/render",
    "crates/ui",
    "crates/mcp",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
suite-hub = { path = "shared/hub" }
suite-mcp = { path = "shared/mcp" }
suite-shell = { path = "shared/shell" }
suite-ui = { path = "shared/ui" }
aiframes-core = { path = "crates/core" }
aiframes-media = { path = "crates/media" }
aiframes-render = { path = "crates/render" }
aiframes-ui = { path = "crates/ui" }
aiframes-mcp = { path = "crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
